name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon lintDebug assembleDebug
      - name: Build and verify signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export SIGNING_FILE="$RUNNER_TEMP/mobile-indicator.p12"
          trap 'rm -f "$SIGNING_FILE"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 -d > "$SIGNING_FILE"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk mobile-internet-indicator.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs mobile-internet-indicator.apk
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: signed-apk
          path: mobile-internet-indicator.apk
